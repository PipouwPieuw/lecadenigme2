<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aliens &amp; chapeaux — Troncadelle</title>
	<link rel="stylesheet" href="css/aliens-and-hats.css">
	<script src="js/puzzle-instance.js"></script>
	<script src="js/aliens-and-hats-core.js"></script>
</head>
<body>
	<main id="puzzle_shell">
		<section id="object_box" aria-label="Réserve d'aliens">
			<div id="grab_pool" aria-label="Réserve d'aliens"></div>
			<div id="translation_wheel" hidden>
				<div class="wheel_viewport">
					<button type="button" id="btn_wheel_match" class="wheel_match" aria-label="Associer" title="Associer"><img src="assets/wheel/match.png" alt="" draggable="false"></button>
					<div class="wheel_assembly">
						<div id="wheel_ring_glyphs" class="wheel_ring wheel_ring--glyphs" tabindex="0" role="slider" aria-label="Symboles" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0"></div>
						<div id="wheel_ring_letters" class="wheel_ring wheel_ring--letters" tabindex="0" role="slider" aria-label="Lettres" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0"></div>
						<button type="button" id="btn_wheel_matches" class="wheel_validate" aria-label="Correspondances"><img src="assets/wheel/wheel-center.png" alt="" draggable="false"></button>
					</div>
				</div>
				<p id="wheel_status" class="visually-hidden" aria-live="polite"></p>
			</div>
		</section>
		<section id="book_stage" aria-label="Livre des spécimens">
			<div id="book_cover">
				<button type="button" id="btn_open_book" aria-expanded="false" aria-controls="book_open">
					<img src="assets/misc/bookfront.png" alt="Ouvrir le livre des spécimens" draggable="false">
					<img id="season_name" class="season_name" alt="" draggable="false">
				</button>
			</div>
			<div id="book_open" hidden>
				<div id="book_spreads"></div>
			</div>
		</section>
	</main>
	<div id="match_history" hidden role="dialog" aria-labelledby="match_history_title" aria-modal="true">
		<div id="match_history_card">
			<div class="match_history_sheet">
			<button type="button" id="btn_match_history_close" aria-label="Fermer la fenêtre" title="Fermer la fenêtre"><img src="assets/wheel/close.png" alt="" draggable="false"></button>
			<div class="match_history_body">
				<h2 id="match_history_title">Correspondances</h2>
				<p id="match_history_empty" hidden>Aucune correspondance.</p>
				<div class="match_history_scroll">
					<table class="match_history_table">
						<caption class="visually-hidden">Correspondances entre symboles et lettres</caption>
						<thead>
							<tr>
								<th scope="col">Symbole</th>
								<th scope="col">Lettre</th>
								<th scope="col"><span class="visually-hidden">Action</span></th>
							</tr>
						</thead>
						<tbody id="match_history_rows"></tbody>
					</table>
				</div>
			</div>
			</div>
		</div>
	</div>
	<div id="password_reveal" hidden role="dialog" aria-labelledby="password_reveal_title" aria-modal="true">
		<div id="password_reveal_card">
			<h2 id="password_reveal_title">Moitié du mot de passe</h2>
			<p class="visually-hidden">Une partie du mot de passe a été dévoilée.</p>
			<p id="password_half_text" aria-live="assertive"></p>
			<p>Communiquez cette moitié à votre partenaire.</p>
			<button type="button" id="btn_dismiss_reveal">Fermer</button>
		</div>
	</div>
	<script>
		AliensAndHatsCore.init({ role: 'troncadelle' });
	</script>
</body>
</html>
