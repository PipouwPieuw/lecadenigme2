<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aliens &amp; chapeaux — Ravabulle</title>
	<link rel="stylesheet" href="css/aliens-and-hats.css">
	<script src="js/puzzle-instance.js"></script>
	<script src="js/aliens-and-hats-core.js"></script>
</head>
<body>
	<main id="puzzle_shell">
		<section id="object_box" aria-label="Réserve de chapeaux">
			<div id="grab_pool" aria-label="Réserve de chapeaux"></div>
			<div id="translation_wheel" hidden>
				<div class="wheel_viewport">
					<div class="wheel_marker wheel_marker--glyph" aria-hidden="true"></div>
					<div class="wheel_marker wheel_marker--letter" aria-hidden="true"></div>
					<div class="wheel_assembly">
						<div id="wheel_ring_glyphs" class="wheel_ring wheel_ring--glyphs" tabindex="0" role="slider" aria-label="Symboles" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0"></div>
						<div id="wheel_ring_letters" class="wheel_ring wheel_ring--letters" tabindex="0" role="slider" aria-label="Lettres" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0"></div>
						<button type="button" id="btn_wheel_validate" class="wheel_validate">Valider</button>
					</div>
				</div>
				<button type="button" id="btn_wheel_reset" class="wheel_reset">Réinitialiser</button>
				<p id="wheel_status" class="visually-hidden" aria-live="polite"></p>
			</div>
		</section>
		<section id="book_stage" aria-label="Livre des spécimens">
			<div id="book_cover">
				<button type="button" id="btn_open_book" aria-expanded="false" aria-controls="book_open">
					<img src="assets/misc/bookfront.png" alt="Ouvrir le livre des spécimens" draggable="false">
					<span id="season_name" class="season_name"></span>
				</button>
			</div>
			<div id="book_open" hidden>
				<div id="book_spreads"></div>
			</div>
		</section>
	</main>
	<div id="password_reveal" hidden role="dialog" aria-labelledby="password_reveal_title" aria-modal="true">
		<div id="password_reveal_card">
			<h2 id="password_reveal_title">Moitié du mot de passe</h2>
			<p class="visually-hidden">Une partie du mot de passe a été dévoilée.</p>
			<p id="password_half_text" aria-live="assertive"></p>
			<p>Communiquez cette moitié à votre partenaire.</p>
			<button type="button" id="btn_dismiss_reveal">Fermer</button>
		</div>
	</div>
	<script>
		AliensAndHatsCore.init({ role: 'ravabulle' });
	</script>
</body>
</html>
